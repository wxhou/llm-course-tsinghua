<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f0ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0d0f" />
    <script>
      /* 首帧前定主题：否则深色用户先闪一帧浅色，固定定位的抽屉会残留浅色栅格 */
      try {
        if (localStorage.getItem('llm-theme') === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {
        /* 隐私模式下 localStorage 不可读，按浅色渲染 */
      }
    </script>
    <!-- 社交分享卡片：微信内置浏览器对 OG 支持残缺，description 兜底 -->
    <meta property="og:title" content="%SITE_NAME%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_NAME%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%og-image.png" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Course",
      "name": "%SITE_NAME%",
      "description": "%SITE_DESCRIPTION%",
      "inLanguage": "zh-CN",
      "isAccessibleForFree": true,
      "provider": {
        "@type": "Organization",
        "name": "%SITE_NAME%",
        "url": "%SITE_URL%"
      },
      "hasCourseInstance": {
        "@type": "CourseInstance",
        "courseMode": "online",
        "courseWorkload": "P8W"
      }
    }
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23f6f4ee'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-weight='900' font-size='44' fill='none' stroke='%23660874' stroke-width='2.5' text-anchor='middle'%3E01%3C/text%3E%3C/svg%3E" />
    <title>%SITE_NAME%</title>
    <link rel="preconnect" href="https://fonts.loli.net" />
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin />
    <link
      href="https://fonts.loli.net/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
